<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SitterCard — Pet Sitter Reports</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1e293b; --muted:#64748b;
  --accent:#0d9488; --accent-dark:#0f766e; --accent-soft:#ccfbf1;
  --line:#e7e2d8; --radius:16px;
  --shadow:0 2px 12px rgba(30,41,59,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;
  padding-bottom:110px;-webkit-tap-highlight-color:transparent}
header.top{position:sticky;top:0;z-index:10;background:rgba(246,244,239,.92);
  backdrop-filter:blur(12px);padding:16px 20px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
.brand h1{font-size:18px;letter-spacing:-.3px}
.brand p{font-size:12px;color:var(--muted)}
main{padding:16px 16px 0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;border:1px solid rgba(231,226,216,.7)}
.card h2{font-size:15px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
label.lbl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin:14px 0 6px}
input[type=text],input[type=date],input[type=time],textarea,select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;
  font-size:14px;cursor:pointer;user-select:none;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.mood{display:flex;gap:6px}
.mood button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;
  font-size:26px;padding:8px 0;cursor:pointer;filter:grayscale(1);opacity:.5}
.mood button.on{border-color:var(--accent);background:var(--accent-soft);filter:none;opacity:1}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;
  font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-dark)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);margin-top:8px}
.btn.small{padding:10px;font-size:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;
  background:#fff;border-top:1px solid var(--line);display:flex;
  padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;background:none;border:none;font-size:11px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:inherit}
nav.tabs button .ic{font-size:22px}
nav.tabs button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:18px;width:60px;height:60px;
  border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:30px;
  box-shadow:0 6px 20px rgba(13,148,136,.45);cursor:pointer;z-index:11}
.report-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.report-row:last-child{border:none}
.thumb{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--accent-soft);flex:none;
  display:grid;place-items:center;font-size:26px;color:var(--accent-dark)}
.report-row .meta{flex:1;min-width:0}
.report-row .meta b{font-size:15px}
.report-row .meta p{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-dark);
  border-radius:999px;padding:4px 10px;white-space:nowrap}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 8px;text-align:center}
.stat b{font-size:22px;display:block;color:var(--accent-dark)}
.stat span{font-size:11px;color:var(--muted)}
.photo-prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-prev .ph{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-prev .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;
  border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer}
.filebox{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;
  color:var(--muted);font-size:14px;cursor:pointer;margin-top:8px}
.filebox input{display:none}
.empty{text-align:center;color:var(--muted);padding:32px 12px;font-size:14px}
.empty .big{font-size:40px;display:block;margin-bottom:8px}
.sharebox{background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:var(--radius);
  padding:16px;margin-bottom:14px}
.sharebox code{display:block;background:#fff;border-radius:8px;padding:10px;font-size:12px;
  word-break:break-all;margin:10px 0;color:var(--accent-dark)}
.hidden{display:none!important}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:#1e293b;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:99;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.del{color:#dc2626;background:none;border:none;font-size:13px;cursor:pointer;padding:6px}
.pet-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:grid;
  place-items:center;font-size:24px;flex:none}
select.petpick{font-size:16px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.6px;margin:18px 4px 10px}
</style>
</head>
<body>

<header class="top">
  <div class="logo">🐾</div>
  <div class="brand"><h1>SitterCard</h1><p>Daily report cards for pet sitters</p></div>
</header>

<main id="app"></main>
<button class="fab" id="fab" title="New report">＋</button>

<nav class="tabs" id="tabs">
  <button data-view="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-view="clients"><span class="ic">🐶</span>Clients</button>
  <button data-view="new"><span class="ic">📝</span>New report</button>
  <button data-view="settings"><span class="ic">⚙️</span>Settings</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ---------- store ---------- */
const KEY='sittercard_v1';
const uid=()=> 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.reports) return s; }catch(e){} return null; }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
let state = load();
if(!state){
  state={ sitter:{name:"", phone:""}, pets:[], reports:[] };
}
const MOODS=['😞','😐','🙂','😄','🤩'];
const ACTS=[['walk','🚶 Walk'],['fed','🍽️ Fed'],['water','💧 Fresh water'],['potty','🚻 Potty'],['meds','💊 Meds'],['play','🎾 Play']];
const SPECIES=['🐶','🐱','🐰','🐦','🦎','🐹'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=()=>document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function fmtDate(iso){ try{ return new Date(iso+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}catch(e){return iso;} }
function reportLink(id){ const u=new URL('report.html',location.href); u.searchParams.set('id',id); return u.href; }
function petOf(r){ return state.pets.find(p=>p.id===r.petId); }
function photoURL(r){ return (r.photos&&r.photos[0])||''; }
function fileToPhoto(file){ return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{ const max=800; let w=img.width,h=img.height;
    if(Math.max(w,h)>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',0.82)); URL.revokeObjectURL(img.src); };
  img.onerror=rej; img.src=URL.createObjectURL(file);
});}

/* ---------- views ---------- */
let cur='home';
function go(v){ cur=v;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  $('#fab').style.display = v==='new' ? 'none':'block';
  ({home:viewHome,clients:viewClients,new:viewNew,settings:viewSettings})[v]();
  window.scrollTo(0,0);
}

function viewHome(){
  const reps=[...state.reports].sort((a,b)=>b.createdAt-a.createdAt);
  const pets=state.pets.length;
  const thisWeek=reps.filter(r=>Date.now()-r.createdAt<7*864e5).length;
  let h=`<div class="stat-grid">
    <div class="stat"><b>${reps.length}</b><span>reports</span></div>
    <div class="stat"><b>${pets}</b><span>pets</span></div>
    <div class="stat"><b>${thisWeek}</b><span>this week</span></div></div>`;
  h+=`<div class="section-title">Recent reports</div><div class="card">`;
  if(!reps.length){ h+=`<div class="empty"><span class="big">🐾</span>No reports yet.<br>Tap ＋ to create your first visit report.</div>`; }
  reps.slice(0,20).forEach(r=>{
    const ph=photoURL(r);
    h+=`<div class="report-row" data-open="${r.id}">
      ${ph?`<img class="thumb" src="${ph}" alt="">`:`<div class="thumb">🐾</div>`}
      <div class="meta"><b>${esc(r.petName)}</b>
        <p>${fmtDate(r.date)} · ${esc(r.time||'')} · ${r.activities.length} activities</p></div>
      <span class="pill">${MOODS[r.mood-1]||'🙂'}</span></div>`;
  });
  h+=`</div>
  <div class="card"><h2>📣 Try the owner view</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">Every report gets a shareable link. Owners open it — no login, no app.</p>
    ${reps.length?`<button class="btn primary small" data-share="${reps[0].id}">Copy link for latest report</button>`:`<p class="hint">Create a report first.</p>`}
  </div>`;
  app().innerHTML=h;
  app().querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>shareSheet(el.dataset.open));
  const sh=app().querySelector('[data-share]'); if(sh) sh.onclick=()=>copyLink(sh.dataset.share);
}

function viewClients(){
  let h=`<div class="card"><h2>➕ Add a pet</h2>
    <label class="lbl">Pet name</label><input type="text" id="p_name" placeholder="e.g. Biscuit" autocomplete="off">
    <div class="row" style="margin-top:10px">
      <div style="flex:1"><label class="lbl">Species</label><select id="p_species">
        <option>Dog</option><option>Cat</option><option>Rabbit</option><option>Bird</option><option>Reptile</option><option>Other</option></select></div>
      <div style="flex:1"><label class="lbl">Breed (optional)</label><input type="text" id="p_breed" placeholder="e.g. Golden" autocomplete="off"></div>
    </div>
    <label class="lbl">Owner name</label><input type="text" id="p_owner" placeholder="e.g. Sarah L." autocomplete="off">
    <label class="lbl">Notes (optional)</label><textarea id="p_notes" style="min-height:56px" placeholder="Allergies, quirks, vet number…"></textarea>
    <button class="btn primary" style="margin-top:12px" id="p_add">Save pet</button></div>`;
  h+=`<div class="section-title">Your clients (${state.pets.length})</div><div class="card">`;
  if(!state.pets.length) h+=`<div class="empty"><span class="big">🐶</span>No pets yet — add your first client above.</div>`;
  [...state.pets].reverse().forEach(p=>{
    const n=state.reports.filter(r=>r.petId===p.id).length;
    h+=`<div class="report-row"><div class="pet-avatar">${SPECIES[['Dog','Cat','Rabbit','Bird','Reptile','Hamster'].indexOf(p.species)]||'🐾'}</div>
      <div class="meta"><b>${esc(p.name)}</b><p>${esc(p.species||'')}${p.breed?' · '+esc(p.breed):''} · Owner: ${esc(p.owner||'—')}</p></div>
      <span class="pill">${n} visit${n===1?'':'s'}</span>
      <button class="del" data-delpet="${p.id}">✕</button></div>`;
  });
  h+=`</div>`;
  app().innerHTML=h;
  $('#p_add').onclick=()=>{
    const name=$('#p_name').value.trim(); if(!name){toast('Pet name is required');return;}
    state.pets.push({id:uid(),name,species:$('#p_species').value,breed:$('#p_breed').value.trim(),
      owner:$('#p_owner').value.trim(),notes:$('#p_notes').value.trim()});
    save(); toast('Saved '+name); viewClients();
  };
  app().querySelectorAll('[data-delpet]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    if(!confirm('Delete this pet? Reports are kept.'))return;
    state.pets=state.pets.filter(p=>p.id!==b.dataset.delpet); save(); viewClients();});
}

/* --- new report form state --- */
let form={petId:'',newPet:'',owner:'',date:'',time:'',acts:new Set(),mood:4,notes:'',photos:[]};
function viewNew(){
  form={petId:state.pets.length===1?state.pets[0].id:'',newPet:'',owner:'',date:new Date().toISOString().slice(0,10),
    time:new Date().toTimeString().slice(0,5),acts:new Set(),mood:4,notes:'',photos:[]};
  let h=`<div class="card"><h2>🐾 New visit report</h2>
    <label class="lbl">Pet</label>
    <select class="petpick" id="f_pet">
      ${state.pets.length? '' : '<option value="">— add a pet below —</option>'}
      ${state.pets.map(p=>`<option value="${p.id}" ${form.petId===p.id?'selected':''}>${esc(p.name)} (${esc(p.owner||'no owner')})</option>`).join('')}
      <option value="__new">＋ New pet…</option>
    </select>
    <div id="newpet_wrap" class="hidden">
      <input type="text" id="f_newpet" placeholder="Pet name" style="margin-top:8px" autocomplete="off">
      <input type="text" id="f_owner" placeholder="Owner name" style="margin-top:8px" autocomplete="off">
    </div>
    <div class="row" style="margin-top:4px">
      <div style="flex:1"><label class="lbl">Date</label><input type="date" id="f_date" value="${form.date}"></div>
      <div style="flex:1"><label class="lbl">Time</label><input type="time" id="f_time" value="${form.time}"></div>
    </div>
    <label class="lbl">Activities</label><div class="chips" id="f_acts">
      ${ACTS.map(([k,l])=>`<div class="chip" data-act="${k}">${l}</div>`).join('')}
    </div>
    <label class="lbl">Mood</label><div class="mood" id="f_mood">
      ${MOODS.map((m,i)=>`<button data-m="${i+1}" class="${i+1===4?'on':''}">${m}</button>`).join('')}
    </div>
    <label class="lbl">Notes for the owner</label>
    <textarea id="f_notes" placeholder="Biscuit loved the park today! Ate all her dinner…"></textarea>
    <label class="lbl">Photos (up to 3)</label>
    <div class="filebox" id="f_pick">📷 Tap to add photos<input type="file" id="f_files" accept="image/*" multiple></div>
    <div class="photo-prev" id="f_prev"></div>
    <p class="hint">Tip: on your phone this opens the camera.</p>
    <button class="btn primary" id="f_save" style="margin-top:16px">Create report card ✨</button>
  </div>`;
  app().innerHTML=h;
  const petSel=$('#f_pet');
  petSel.onchange=()=>$('#newpet_wrap').classList.toggle('hidden',petSel.value!=='__new');
  if(state.pets.length&&petSel.value==='__new') $('#newpet_wrap').classList.remove('hidden');
  app().querySelectorAll('#f_acts .chip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.act; form.acts.has(k)?form.acts.delete(k):form.acts.add(k); c.classList.toggle('on');});
  app().querySelectorAll('#f_mood button').forEach(b=>b.onclick=()=>{
    form.mood=+b.dataset.m; app().querySelectorAll('#f_mood button').forEach(x=>x.classList.toggle('on',x===b));});
  $('#f_pick').onclick=()=>$('#f_files').click();
  $('#f_files').onchange=async e=>{
    for(const f of e.target.files){
      if(form.photos.length>=3){toast('Max 3 photos');break;}
      try{ form.photos.push(await fileToPhoto(f)); }catch(err){toast('Could not read photo');}
    }
    renderPrev(); e.target.value='';
  };
  function renderPrev(){
    $('#f_prev').innerHTML=form.photos.map((p,i)=>`<div class="ph"><img src="${p}"><button class="rm" data-i="${i}">✕</button></div>`).join('');
    app().querySelectorAll('#f_prev .rm').forEach(b=>b.onclick=()=>{form.photos.splice(+b.dataset.i,1);renderPrev();});
  }
  $('#f_save').onclick=()=>{
    let petId=petSel.value, petName='', owner='';
    if(petId==='__new'||!petId){
      petName=$('#f_newpet').value.trim(); owner=$('#f_owner').value.trim();
      if(!petName){toast('Pet name is required');return;}
      const p={id:uid(),name:petName,species:'Dog',breed:'',owner,notes:''};
      state.pets.push(p); petId=p.id;
    } else { const p=state.pets.find(x=>x.id===petId); petName=p.name; owner=p.owner||''; }
    const r={id:uid(),petId,petName,ownerName:owner,date:$('#f_date').value,time:$('#f_time').value,
      activities:[...form.acts],mood:form.mood,notes:$('#f_notes').value.trim(),
      photos:[...form.photos],replies:[],createdAt:Date.now()};
    state.reports.unshift(r); save();
    shareSheet(r.id,true);
  };
}

function viewSettings(){
  app().innerHTML=`<div class="card"><h2>⚙️ Your branding</h2>
    <p class="hint" style="margin-bottom:8px">Shows on every report card you share.</p>
    <label class="lbl">Business name</label>
    <input type="text" id="s_name" value="${esc(state.sitter.name)}" placeholder="e.g. Maya's Pet Care">
    <label class="lbl">Phone (optional)</label>
    <input type="text" id="s_phone" value="${esc(state.sitter.phone)}" placeholder="e.g. 555-1234">
    <button class="btn primary" id="s_save" style="margin-top:12px">Save</button></div>
  <div class="card"><h2>📦 Data</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">Everything is stored on this device (prototype).</p>
    <button class="btn ghost small" id="s_seed">Load demo data</button>
    <button class="btn ghost small" id="s_wipe" style="color:#dc2626">Delete all data</button></div>`;
  $('#s_save').onclick=()=>{state.sitter.name=$('#s_name').value.trim();state.sitter.phone=$('#s_phone').value.trim();save();toast('Branding saved');};
  $('#s_seed').onclick=()=>{seed();toast('Demo data loaded');go('home');};
  $('#s_wipe').onclick=()=>{if(confirm('Delete ALL pets and reports?')){state={sitter:state.sitter,pets:[],reports:[]};save();go('home');}};
}

/* --- share sheet --- */
function shareSheet(id,isNew){
  const r=state.reports.find(x=>x.id===id); if(!r)return;
  const link=reportLink(id);
  app().innerHTML=`<div class="sharebox">
      <h2 style="font-size:17px;margin-bottom:6px">${isNew?'🎉 Report card ready!':'🔗 Share report'}</h2>
      <p style="font-size:14px">Send this link to <b>${esc(r.ownerName||'the owner')}</b> — no login needed.</p>
      <code>${esc(link)}</code>
      <button class="btn primary" id="sh_copy">Copy link</button>
      ${navigator.share?'<button class="btn ghost" id="sh_native">Share via text / WhatsApp…</button>':''}
      <button class="btn ghost" id="sh_view">Preview owner card</button>
      <button class="btn ghost" id="sh_back">← Back to reports</button>
    </div>`;
  $('#sh_copy').onclick=()=>copyLink(id);
  const n=$('#sh_native'); if(n) n.onclick=()=>navigator.share({title:'SitterCard report',text:`Visit report for ${r.petName} 🐾`,url:link}).catch(()=>{});
  $('#sh_view').onclick=()=>location.href=link;
  $('#sh_back').onclick=()=>go('home');
}
async function copyLink(id){
  const link=reportLink(id);
  try{ await navigator.clipboard.writeText(link); toast('Link copied ✓'); }
  catch(e){ prompt('Copy this link:',link); }
}

/* --- demo seed --- */
function seed(){
  if(state.pets.length||state.reports.length){ if(!confirm('Replace current data with demo data?'))return; }
  const p1={id:uid(),name:'Biscuit',species:'Dog',breed:'Golden Retriever',owner:'Sarah L.',notes:'Allergic to chicken.'};
  const p2={id:uid(),name:'Miso',species:'Cat',breed:'Tabby',owner:'Dev P.',notes:'Shy at first.'};
  const svg=s=> 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#ccfbf1"/><text x="200" y="235" font-size="150" text-anchor="middle">${s}</text></svg>`);
  state.pets=[p1,p2];
  const today=new Date().toISOString().slice(0,10);
  state.reports=[
