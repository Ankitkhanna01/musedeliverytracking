<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SitterCard — Visit Report</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1e293b;--muted:#64748b;--accent:#0d9488;--accent-dark:#0f766e;
  --accent-soft:#ccfbf1;--line:#e7e2d8;--radius:18px;--shadow:0 4px 24px rgba(30,41,59,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;padding:20px 16px 40px}
.brandbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:21px}
.brandbar b{font-size:15px}.brandbar p{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.hero{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#ccfbf1,#fef3c7);display:grid;place-items:center;font-size:90px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .petname{position:absolute;left:16px;bottom:14px;background:rgba(0,0,0,.55);color:#fff;
  padding:8px 16px;border-radius:999px;font-size:18px;font-weight:800;backdrop-filter:blur(4px)}
.body{padding:18px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:5px 12px}
.moodline{font-size:15px;margin:6px 0 12px}
.moodline b{font-size:26px;vertical-align:middle;margin-right:6px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
.act{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.act:last-child{border:none}
.act .tick{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);
  display:grid;place-items:center;font-weight:800;flex:none}
.notes{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px;font-size:15px;line-height:1.55}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer}
.reply{border-top:1px solid var(--line);padding:12px 0}
.reply b{font-size:14px}.reply p{font-size:14px;margin-top:3px}.reply time{font-size:11px;color:var(--muted)}
.replybox{display:flex;gap:8px;margin-top:4px}
.replybox input{flex:1;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit}
.replybox input:focus{outline:none;border-color:var(--accent)}
.replybox button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:0 18px;font-size:15px;font-weight:700;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.7}
.foot a{color:var(--accent-dark);font-weight:700;text-decoration:none}
.err{text-align:center;padding:60px 20px;color:var(--muted)}
.err .big{font-size:56px;display:block;margin-bottom:12px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:50;padding:20px}
.lightbox.show{display:grid}.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<div id="app"></div>
<div class="lightbox" id="lb" onclick="this.classList.remove('show')"><img id="lbimg" alt=""></div>

<script>
const KEY='sittercard_v1';
const MOODS=['😞','😐','🙂','😄','🤩'];
const MOODLBL=['','had a rough visit','was a bit quiet','was content','was happy','had the BEST time'];
const ACTLBL={walk:'🚶 Walk',fed:'🍽️ Fed',water:'💧 Fresh water',potty:'🚻 Potty break',meds:'💊 Meds given',play:'🎾 Playtime'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');
let state=null; try{state=JSON.parse(localStorage.getItem(KEY));}catch(e){}
const r=state&&state.reports?state.reports.find(x=>x.id===id):null;
const app=document.getElementById('app');

if(!r){
  app.innerHTML=`<div class="err"><span class="big">🐾</span><h2>Report not found</h2>
  <p style="margin-top:8px">This card lives on the sitter's device in this demo.<br>Open the link on the same phone/browser that created it.</p></div>`;
}else{
  const brand=esc((state.sitter&&state.sitter.name)||'Your pet sitter');
  const phone=state.sitter&&state.sitter.phone?esc(state.sitter.phone):'';
  const d=new Date(r.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const photos=(r.photos||[]).filter(Boolean);
  const hero=photos[0]?`<img src="${photos[0]}" alt="${esc(r.petName)}">`:'🐾';
  const replies=(r.replies||[]).map(x=>`<div class="reply"><b>${esc(x.from||'Owner')}</b> <time>${new Date(x.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</time><p>${esc(x.text)}</p></div>`).join('');
  app.innerHTML=`
  <div class="brandbar"><div class="logo">🐾</div><div><b>${brand}</b><p>${phone}SitterCard visit report</p></div></div>
  <div class="card">
    <div class="hero">${hero}<div class="petname">${esc(r.petName)}</div></div>
    <div class="body">
      <div class="meta-row"><span class="pill">📅 ${esc(d)}</span>${r.time?`<span class="pill">🕐 ${esc(r.time)}</span>`:''}</div>
      <div class="moodline"><b>${MOODS[(r.mood||4)-1]}</b>${esc(r.petName)} ${MOODLBL[r.mood||4]}.</div>
      <h3>Today's activities</h3>
      ${(r.activities||[]).length? r.activities.map(a=>`<div class="act"><span class="tick">✓</span>${esc(ACTLBL[a]||a)}</div>`).join('') : '<p style="color:var(--muted);font-size:14px">No activities logged.</p>'}
      ${r.notes?`<h3>Notes from your sitter</h3><div class="notes">${esc(r.notes)}</div>`:''}
      ${photos.length>1?`<h3>Photos</h3><div class="gallery">${photos.slice(1).map(p=>`<img src="${p}" loading="lazy">`).join('')}</div>`:''}
      <h3>Replies</h3>
      <div id="replies">${replies||'<p style="color:var(--muted);font-size:14px">No replies yet — say hi! 👋</p>'}</div>
      <div class="replybox"><input id="rin" placeholder="Reply to your sitter…" maxlength="500"><button id="rsend">Send</button></div>
    </div>
  </div>
  <div class="foot">Made with 💛 by <b>${brand}</b><br><a href="index.html">SitterCard</a> · digital report cards for pet sitters</div>`;
  document.querySelectorAll('.gallery img').forEach(im=>im.onclick=()=>{document.getElementById('lbimg').src=im.src;document.getElementById('lb').classList.add('show');});
  const send=()=>{
    const t=document.getElementById('rin').value.trim(); if(!t)return;
    r.replies=r.replies||[]; r.replies.push({from:r.ownerName||'Owner',text:t,at:Date.now()});
    localStorage.setItem(KEY,JSON.stringify(state));
    const d2=document.createElement('div'); d2.className='reply';
    d2.innerHTML=`<b>${esc(r.ownerName||'Owner')}</b> <time>just now</time><p>${esc(t)}</p>`;
    const box=document.getElementById('replies');
    if(box.querySelector('p')) box.innerHTML='';
    box.appendChild(d2); document.getElementById('rin').value='';
  };
  document.getElementById('rsend').onclick=send;
  document.getElementById('rin').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
  document.title=`${r.petName} — SitterCard report`;
}
</script>
</body>
</html>
